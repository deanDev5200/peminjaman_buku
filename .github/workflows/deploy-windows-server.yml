name: Deploy to Windows Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Build app
        env:
          CI: true
        run: npm run build

      - name: Ensure deployment repo exists
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            @echo off
            setlocal enableextensions
            set "DEPLOY_PATH=${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}"
            if not defined DEPLOY_PATH exit /b 1
            if not exist "%DEPLOY_PATH%" mkdir "%DEPLOY_PATH%"
            if not exist "%DEPLOY_PATH%\.git" (
              git clone https://${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git "%DEPLOY_PATH%"
              if errorlevel 1 exit /b 1
            )
            git -C "%DEPLOY_PATH%" fetch origin --prune
            if errorlevel 1 exit /b 1
            git -C "%DEPLOY_PATH%" rev-parse --verify main >nul 2>&1
            if not errorlevel 1 (
              git -C "%DEPLOY_PATH%" checkout main
              if errorlevel 1 exit /b 1
              git -C "%DEPLOY_PATH%" pull --ff-only origin main
              if errorlevel 1 exit /b 1
            ) else (
              git -C "%DEPLOY_PATH%" rev-parse --verify master >nul 2>&1
              if not errorlevel 1 (
                git -C "%DEPLOY_PATH%" checkout master
                if errorlevel 1 exit /b 1
                git -C "%DEPLOY_PATH%" pull --ff-only origin master
                if errorlevel 1 exit /b 1
              ) else (
                git -C "%DEPLOY_PATH%" checkout -b main
                if errorlevel 1 exit /b 1
              )
            )
            echo Deployment repository ready at %DEPLOY_PATH%

      - name: Create production environment file
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            @echo off
            setlocal enableextensions
            set "DEPLOY_PATH=${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}"
            if not defined DEPLOY_PATH exit /b 1
            > "%DEPLOY_PATH%\.env.production" (
              echo PORT=${{ secrets.APP_PORT || '3005' }}
              echo HOST=0.0.0.0
              echo NEXT_TELEMETRY_DISABLED=1
              echo AUTH_SECRET=${{ secrets.AUTH_SECRET }}
              echo APP_PASSWORD=${{ secrets.APP_PASSWORD }}
            )
            if errorlevel 1 exit /b 1
            echo Production environment written to %DEPLOY_PATH%\.env.production

      - name: Install dependencies on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            @echo off
            setlocal enableextensions
            set "DEPLOY_PATH=${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}"
            if not defined DEPLOY_PATH exit /b 1
            if not exist "%DEPLOY_PATH%\package.json" exit /b 1
            cd /d "%DEPLOY_PATH%"
            npm ci
            if errorlevel 1 exit /b 1
            npm run init-db
            if errorlevel 1 exit /b 1
            echo Server dependencies installed.

      - name: Build app on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            @echo off
            setlocal enableextensions
            set "DEPLOY_PATH=${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}"
            if not defined DEPLOY_PATH exit /b 1
            cd /d "%DEPLOY_PATH%"
            npm run build
            if errorlevel 1 exit /b 1
            echo Production build completed on Windows server.

      - name: Install PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            @echo off
            setlocal enableextensions
            npm install -g pm2
            if errorlevel 1 exit /b 1

      - name: Restart app with PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            @echo off
            setlocal enableextensions
            set "DEPLOY_PATH=${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}"
            set "APP_NAME=peminjaman-buku"
            set "APP_PORT=${{ secrets.APP_PORT || '3005' }}"
            if not defined DEPLOY_PATH exit /b 1

            pm2 show %APP_NAME% >nul 2>&1
            if not errorlevel 1 (
              pm2 delete %APP_NAME%
              if errorlevel 1 exit /b 1
            )

            cd /d "%DEPLOY_PATH%"
            pm2 start "npm run start -- --hostname 0.0.0.0 --port %APP_PORT%" --name %APP_NAME% --cwd "%DEPLOY_PATH%" --watch false
            if errorlevel 1 exit /b 1
            pm2 save
            if errorlevel 1 exit /b 1
            echo PM2 started %APP_NAME% on port %APP_PORT%

      - name: Verify app health
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            @echo off
            setlocal enableextensions
            set "APP_PORT=${{ secrets.APP_PORT || '3005' }}"
            powershell -NoProfile -ExecutionPolicy Bypass -Command "try { $r = Invoke-WebRequest -Uri 'http://127.0.0.1:%APP_PORT%' -UseBasicParsing -TimeoutSec 20; if ($r.StatusCode -lt 200 -or $r.StatusCode -ge 400) { throw \"Unexpected status: $($r.StatusCode)\" }; Write-Host \"App health check passed: http://127.0.0.1:%APP_PORT% => $($r.StatusCode)\" } catch { throw \"Application health check failed at http://127.0.0.1:%APP_PORT%\" }"
            if errorlevel 1 exit /b 1

      - name: Show app status
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script_stop: true
          script: |
            @echo off
            pm2 list
            if errorlevel 1 exit /b 1
            echo Deployment completed successfully.
