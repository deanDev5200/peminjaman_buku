name: Deploy to Windows Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules
        run: npm rebuild better-sqlite3

      - name: Build app
        env:
          CI: true
        run: npm run build

      - name: Setup deployment directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "if (!(Test-Path '${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}')) { New-Item -ItemType Directory -Path '${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}' -Force; cd '${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}'; git clone https://${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git . }; Write-Host 'Deployment directory ready'"

      - name: Install PM2 globally
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "npm install -g pm2"

      - name: Stop application and backup
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "cd '${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}'; pm2 stop peminjaman-buku 2>$null; pm2 delete peminjaman-buku 2>$null; if (Test-Path 'package.json') { $timestamp = Get-Date -Format 'yyyyMMdd_HHmmss'; Compress-Archive -Path * -DestinationPath \"backup_$timestamp.zip\" -Force }"

      - name: Pull latest changes
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "cd '${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}'; git fetch origin --prune; git checkout main; git pull --ff-only origin main"

      - name: Create production environment file
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script: >-
            C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "$deployPath = '${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}'; $envContent = @'
            PORT=${{ secrets.APP_PORT || '3005' }}
            HOST=0.0.0.0
            NEXT_TELEMETRY_DISABLED=1
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}
            APP_PASSWORD=${{ secrets.APP_PASSWORD }}
            '@; Set-Content -Path (Join-Path $deployPath '.env.production') -Value $envContent -Encoding UTF8; Write-Host 'Production env written'"

      - name: Install dependencies and build on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "cd '${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}'; npm ci; npm run init-db; npm run build; Write-Host 'Server dependencies and build completed'"

      - name: Restart app with PM2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "cd '${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}'; pm2 start \"npm run start -- --hostname 0.0.0.0 --port ${{ secrets.APP_PORT || '3005' }}\" --name peminjaman-buku --cwd '${{ secrets.WINDOWS_DEPLOY_PATH || 'C:\\peminjaman-buku' }}' --watch false; pm2 save; Write-Host 'Deployment completed successfully'"

      - name: Show app status
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.WINDOWS_SERVER_HOST }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: ${{ secrets.WINDOWS_SERVER_PORT || 22 }}
          script: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -Command "pm2 list"
